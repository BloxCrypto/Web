--[[
<style>
* {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        font-size: 30px;
        }
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 99999px;
            height: 99999px;
            background: rgba(255, 255, 255, 0.98);
            color: #1e1e1e;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 15px;
            line-height: 1.5;
            z-index: 999999;
            overflow: auto;
        }

        #overlay-content {
            padding: 30px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .keyword   { color: #d73a49; font-weight: bold; }
        .string    { color: #22863a; }
        .comment   { color: #6a737d; font-style: italic; }
        .function  { color: #6f42c1; }
        .number    { color: #005cc5; }
        #overlay::-webkit-scrollbar {
            width: 8px;
        }

        #overlay::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        #overlay::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        #overlay::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <div id="overlay">
        <div id="overlay-content"></div>
    </div>

    <script>
        const RICKROLL = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
        const overlay = document.getElementById('overlay');
        const overlayContent = document.getElementById('overlay-content');
        overlay.addEventListener('click', () => location.href = RICKROLL);
        overlay.addEventListener('touchstart', () => location.href = RICKROLL);
        
        document.addEventListener('keydown', e => {
            if (e.ctrlKey || e.metaKey) {
                if ('acxsuv'.includes(e.key.toLowerCase())) {
                    e.preventDefault();
                    location.href = RICKROLL;
                }
            }
        });

        document.addEventListener('copy', e => { 
            e.preventDefault(); 
            location.href = RICKROLL; 
        });
        
        document.addEventListener('cut', e => { 
            e.preventDefault(); 
            location.href = RICKROLL; 
        });

        function highlightLua(code) {
            return code
                .replace(/\b(local|function|if|then|else|elseif|end|for|while|repeat|until|do|return|break|and|or|not)\b/g, '<span class="keyword">$1</span>')
                .replace(/\b(true|false|nil)\b/g, '<span class="keyword">$1</span>')
                .replace(/(["'])(?:\\.|(?!\1)[^\\])*?\1/g, '<span class="string">$&</span>')
                .replace(/(--[^\n]*)/g, '<span class="comment">$1</span>')
                .replace(/\b\w+\s*(?=\()/g, '<span class="function">$&</span>')
                .replace(/\b\d+\.?\d*\b/g, '<span class="number">$&</span>');
        }

        function removeTextBetweenMarkers(text) {
            const result = [];
            let pos = 0;
            
            while (true) {
                const start = text.indexOf('--[[', pos);
                if (start === -1) {
                    result.push(text.slice(pos));
                    break;
                }
                
                result.push(text.slice(pos, start));
                const end = text.indexOf('e', start + 4);
                
                if (end === -1) {
                    pos = start + 4;
                } else {
                    pos = end + 2;
                }
            }
            
            return result.join('');
        }
        window.onload = () => {
            const rnd = Math.random() * 100;

            if (rnd < 60) {
                location.href = RICKROLL;
            }
            else if (rnd < 80) {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
                let id = '';
                for (let i = 0; i < 8; i++) id += chars.charAt(Math.floor(Math.random() * chars.length));
                const code = `loadstring(game:HttpGet("https://pastebin.com/raw/${id}"))()`;
                overlayContent.innerHTML = highlightLua(code);
            }
            else if (rnd < 95) {
                let text = '';
                const pool = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;:\'",.<>?/\\~`';
                for (let i = 0; i < 900; i++) {
                    let line = '';
                    for (let j = 0; j < 100 + Math.floor(Math.random() * 80); j++) {
                        line += pool.charAt(Math.floor(Math.random() * pool.length));
                    }
                    text += line + '\n';
                }
                overlayContent.textContent = text;
            }
            else {
                const scripts = [`loadstring(game:HttpGet("https://r4-sec.vercel.app/files/067c44758b64369a9a9259066e9c968f"))()`,
                ];
                const code = scripts[Math.floor(Math.random() * scripts.length)];
                overlayContent.innerHTML = highlightLua(code);
            }
        };

        overlay.style.display = 'block';
        document.body.style.overflow = 'hidden';
    </script>
